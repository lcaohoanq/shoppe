  keycloak:
    container_name: keycloak-sp
    image: quay.io/keycloak/keycloak:26.1.3
    ports:
      - 8082:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    networks:
      - microservices-net
    command: 'start-dev --import-realm --verbose'
#    command: 'start-dev'
    volumes:
      - ./identity/shoppe-dev/realm-export.json:/opt/keycloak/data/import/realm-export.json
      - keycloak_data:/opt/keycloak/data

networks:
  microservices-net:
    driver: bridge

