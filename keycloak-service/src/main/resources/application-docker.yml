server:
  port: 9080

spring:
  application:
    name: keycloak-service

  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/movies_db}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak-configured:8080/realms/company-services

springdoc:
  swagger-ui:
    disable-swagger-default-url: true

keycloak:
  url: http://keycloak-configured:8080/realms/company-services/protocol/openid-connect/token

jwt:
  auth:
    converter:
      resource-id: movies-app
      principal-attribute: preferred_username

app:
  cors:
    allowed-origins: http://client:3000

logging:
  level:
    org:
      springframework:
        security: DEBUG
